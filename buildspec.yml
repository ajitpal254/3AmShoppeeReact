version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 14
    commands:
      - npm install
      - npm install --prefix frontend
  pre_build:
    commands:
      - echo Pre-build phase
  build:
    commands:
      - echo Build phase
      - npm run build --prefix frontend
  post_build:
    commands:
      - echo Post-build phase
artifacts:
  files:
    - backend/**/* 
    - frontend/build/**/* 
  base-directory: .